---
- name: Setting up secondary server for ddmail system in prod.
  hosts: secondary_srv
  become: true
  become_user: root
  #become_method: ansible.builtin.su
  #become_flags: "-"
  become_method: sudo

  roles:
    - general_packages
    - disable_ipv6
    - chrony
    - nftables
    - nebula
    - sshd
    - rsyslog
    - unattended-upgrades
    - unbound
    - set_nameserver
    - sysstat
    - postgresql
    - zabbix-server
    - zabbix-agent2
    - nebula_tls_certs
    - ddmail_backup_receiver
    - caddy
